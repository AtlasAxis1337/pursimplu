<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · PUR&simplu</title>
<link rel="icon" href="assets/img/logo-sm.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- LOGIN GATE -->
<div id="gate" class="modal on">
  <div class="overlay on" style="background:linear-gradient(135deg,#2b2b28,#556331)"></div>
  <div class="box">
    <div style="text-align:center;margin-bottom:18px">
      <img src="assets/img/logo.png" alt="PUR&amp;simplu" style="width:120px">
      <div style="font-size:11px;font-weight:700;color:#6b7168;letter-spacing:1.4px;text-transform:uppercase;margin-top:6px">Panou de administrare</div>
    </div>
    <div class="field"><label>Email</label><input class="inp" id="agEmail" value="admin@pursimplu.ro"></div>
    <div class="field"><label>Parolă</label><input class="inp" id="agPass" type="password" value="admin123"
      onkeydown="if(event.key==='Enter')adminLogin()"></div>
    <button class="btn btn-primary btn-block" onclick="adminLogin()">Intră în panou</button>
    <div class="hint">Demo: admin@pursimplu.ro / admin123 · <a href="index.html" style="color:#6d7f3f;font-weight:700">← Înapoi la magazin</a></div>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-wrap hidden" id="app">
  <aside class="side">
    <div class="brand">
      <img src="assets/img/logo.png" alt="" style="width:38px;height:38px;border-radius:50%;background:#fff;padding:2px">
      PUR&amp;simplu
    </div>
    <div class="sep">Principal</div>
    <a data-r="dash" onclick="nav('dash')">📊 Dashboard</a>
    <a data-r="orders" onclick="nav('orders')">📦 Comenzi <span id="sbOrders" class="chip c-new" style="margin-left:auto"></span></a>
    <div class="sep">Catalog</div>
    <a data-r="products" onclick="nav('products')">🏷️ Produse</a>
    <a data-r="stock" onclick="nav('stock')">📉 Stocuri</a>
    <a data-r="cats" onclick="nav('cats')">🗂️ Categorii</a>
    <div class="sep">Marketing</div>
    <a data-r="vouchers" onclick="nav('vouchers')">🎟️ Vouchere</a>
    <div class="sep">Clienți</div>
    <a data-r="users" onclick="nav('users')">👥 Clienți</a>
    <div class="sep">Sistem</div>
    <a data-r="settings" onclick="nav('settings')">⚙️ Setări</a>
    <a href="index.html">🛍️ Vezi magazinul</a>
    <a onclick="adminLogout()" style="color:#ff8a80">🚪 Ieșire</a>
  </aside>
  <main class="admin-main" id="amain"></main>
</div>

<!-- EDIT MODAL -->
<div class="modal" id="mdl">
  <div class="overlay on" onclick="closeMdl()"></div>
  <div class="box wide" id="mdlBox"></div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/admin.js"></script>
<script src="assets/js/admin-import.js"></script>
</body>
</html>
